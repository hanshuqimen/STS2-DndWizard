name: Offline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rules-and-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pure casting and progression rules
        run: dotnet run --project tests/Rules/Rules.csproj -c Release
      - name: Artwork and localization checks
        run: |
          python -m pip install 'Pillow>=10.0,<13'
          python tools/validate_content.py
